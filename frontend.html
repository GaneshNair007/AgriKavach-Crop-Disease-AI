<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AgriKavach - Crop Disease AI</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            oneui: { bg: '#F8FAFC', card: '#FFFFFF', emerald: '#10B981', blue: '#2563EB', amber: '#F59E0B', rose: '#E11D48' }
          },
          borderRadius: { '2xl': '1.25rem', '3xl': '1.75rem', '4xl': '2.25rem', '5xl': '2.5rem' }
        }
      }
    }
  </script>
  
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body { background-color: #F8FAFC; color: #1E293B; font-family: -apple-system, sans-serif; user-select: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .drawer-open { transform: translateY(0%); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .drawer-closed { transform: translateY(100%); transition: transform 0.3s ease-in; }
    .scanner-line { width: 100%; height: 2px; background: #10B981; box-shadow: 0 0 10px #10B981; position: absolute; animation: scan 2s infinite linear; }
    @keyframes scan { 0% { top: 0%; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const API_URL = 'http://localhost:8000/api/v1/crop';

    const DICT = {
      en: {
        appName: "AgriKavach", subTitle: "Field-Robust Crop Pathology AI",
        edgeActive: "Edge Engine Active",
        crops: { TOMATO: "Tomato", POTATO: "Potato", CORN: "Corn", WHEAT: "Wheat", RICE: "Rice" },
        camInstructions: "Position leaf in natural lighting. Avoid shake.",
        startCam: "Start Live Camera", capture: "Capture", upload: "Upload File", closeCam: "Close Camera",
        evaluating: "Evaluating Clarity & Neural Inference...",
        confidence: "CONFIDENCE", sharpness: "SHARPNESS", priority: "PRIORITY",
        tabs: { organic: "Organic Action", chemical: "Chemical Spray", prevention: "Prevention" },
        close: "Close Drawer", errNet: "Network error. Backend not running."
      },
      hi: {
        appName: "एग्री-कवच", subTitle: "फसल रोग पहचान प्रणाली",
        edgeActive: "एज इंजन सक्रिय",
        crops: { TOMATO: "टमाटर", POTATO: "आलू", CORN: "मक्का", WHEAT: "गेहूँ", RICE: "चावल" },
        camInstructions: "पत्ती को प्राकृतिक रोशनी में रखें। कैमरा न हिलाएं।",
        startCam: "कैमरा चालू करें", capture: "फोटो खींचें", upload: "फाइल अपलोड करें", closeCam: "कैमरा बंद करें",
        evaluating: "स्पष्टता और रोग की जांच हो रही है...",
        confidence: "विश्वास", sharpness: "स्पष्टता", priority: "प्राथमिकता",
        tabs: { organic: "जैविक उपाय", chemical: "रासायनिक दवा", prevention: "रोकथाम" },
        close: "बंद करें", errNet: "नेटवर्क त्रुटि। सर्वर बंद है।"
      },
      mr: {
        appName: "अ‍ॅग्री-कवच", subTitle: "पीक रोग निदान प्रणाली",
        edgeActive: "एज इंजिन सक्रिय",
        crops: { TOMATO: "टोमॅटो", POTATO: "बटाटा", CORN: "मका", WHEAT: "गहू", RICE: "तांदूळ" },
        camInstructions: "पान नैसर्गिक प्रकाशात ठेवा. कॅमेरा हलवू नका.",
        startCam: "कॅमेरा सुरू करा", capture: "फोटो काढा", upload: "फाईल अपलोड करा", closeCam: "कॅमेरा बंद करा",
        evaluating: "स्पष्टता आणि रोगाची तपासणी सुरू आहे...",
        confidence: "खात्री", sharpness: "स्पष्टता", priority: "प्राधान्य",
        tabs: { organic: "सेंद्रिय उपाय", chemical: "रासायनिक फवारणी", prevention: "प्रतिबंध" },
        close: "बंद करा", errNet: "नेटवर्क त्रुटी. सर्व्हर बंद आहे."
      }
    };

    const Icon = ({ name, className }) => {
      useEffect(() => { lucide.createIcons(); }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    function App() {
      const [lang, setLang] = useState('en');
      const [crop, setCrop] = useState('TOMATO');
      const [isCamOpen, setIsCamOpen] = useState(false);
      const [isLoading, setIsLoading] = useState(false);
      const [diag, setDiag] = useState(null);
      const [toast, setToast] = useState(null);
      const [activeTab, setActiveTab] = useState('organic');
      
      const videoRef = useRef(null);
      const canvasRef = useRef(null);
      const fileRef = useRef(null);
      const streamRef = useRef(null);

      const d = DICT[lang];

      const showToast = (msg) => { setToast(msg); setTimeout(() => setToast(null), 4000); };

      const startCamera = async () => {
        setIsCamOpen(true);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
          streamRef.current = stream;
          if (videoRef.current) {
            videoRef.current.srcObject = stream;
            videoRef.current.play();
          }
        } catch (err) {
          showToast("Camera access denied or unavailable.");
          setIsCamOpen(false);
        }
      };

      const stopCamera = () => {
        if (streamRef.current) {
          streamRef.current.getTracks().forEach(t => t.stop());
          streamRef.current = null;
        }
        setIsCamOpen(false);
      };

      const captureAndDiagnose = () => {
        if (!videoRef.current || !canvasRef.current) return;
        const video = videoRef.current;
        const canvas = canvasRef.current;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        
        canvas.toBlob((blob) => {
          const file = new File([blob], "capture.jpg", { type: "image/jpeg" });
          stopCamera();
          processFile(file);
        }, 'image/jpeg');
      };

      const handleFileUpload = (e) => {
        if (e.target.files[0]) processFile(e.target.files[0]);
      };

      const processFile = async (file) => {
        setIsLoading(true);
        const fd = new FormData();
        fd.append('image_file', file);
        fd.append('crop_species', crop);
        fd.append('language_pref', lang);

        try {
          const res = await fetch(`${API_URL}/diagnose`, { method: 'POST', body: fd });
          const json = await res.json();
          if (!res.ok) showToast(json.detail?.recommendation || "Error processing image.");
          else { setDiag(json); setActiveTab('organic'); }
        } catch (err) { showToast(d.errNet); }
        finally { setIsLoading(false); if(fileRef.current) fileRef.current.value = ''; }
      };

      return (
        <div className="max-w-md mx-auto min-h-screen flex flex-col relative pb-6 bg-slate-50 shadow-2xl overflow-hidden">
          {/* Toast */}
          {toast && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 w-11/12 max-w-sm z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl text-xs font-bold flex justify-between items-center transition-all">
              <span>{toast}</span><button onClick={() => setToast(null)}>✕</button>
            </div>
          )}

          {/* Top Viewing Area (35%) */}
          <header className="px-6 pt-8 pb-4 shrink-0">
            <div className="flex justify-between items-center">
              <div className="flex items-center gap-1.5 bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wide border border-emerald-200">
                <Icon name="shield-check" className="w-3.5 h-3.5" /> {d.edgeActive}
              </div>
              <div className="flex bg-white rounded-full p-1 shadow-sm border border-slate-100">
                {['en', 'hi', 'mr'].map(l => (
                  <button key={l} onClick={() => {setLang(l); setDiag(null); stopCamera();}} 
                    className={`px-2 py-0.5 text-[10px] font-bold rounded-full uppercase transition-all ${lang === l ? 'bg-slate-900 text-white shadow-md' : 'text-slate-500'}`}>
                    {l}
                  </button>
                ))}
              </div>
            </div>
            <div className="mt-5">
              <h1 className="text-4xl font-extrabold text-slate-900 tracking-tight">{d.appName}</h1>
              <p className="text-sm text-slate-500 font-medium mt-1">{d.subTitle}</p>
            </div>
          </header>

          {/* Bottom Interaction Area (65%) */}
          <div className="flex-1 flex flex-col px-6">
            <div className="flex gap-2 overflow-x-auto no-scrollbar py-2 shrink-0">
              {Object.keys(d.crops).map(c => (
                <button key={c} onClick={() => setCrop(c)} 
                  className={`px-4 py-2.5 rounded-[1.25rem] font-bold text-sm transition-all whitespace-nowrap shadow-sm border ${crop === c ? 'bg-slate-900 text-white border-slate-900 scale-[1.02]' : 'bg-white text-slate-600 border-slate-100 hover:bg-slate-50'}`}>
                  {d.crops[c]}
                </button>
              ))}
            </div>

            <div className="flex-1 flex flex-col justify-center mt-2">
              <div className="relative w-full aspect-[4/5] bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col items-center justify-center">
                
                {isCamOpen ? (
                  <>
                    <video ref={videoRef} className="absolute inset-0 w-full h-full object-cover" playsInline muted autoPlay></video>
                    <div className="scanner-line"></div>
                    <button onClick={stopCamera} className="absolute top-4 right-4 p-2 bg-black/50 text-white rounded-full backdrop-blur-md">
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </>
                ) : (
                  <div className="text-center p-6 flex flex-col items-center">
                    <div className="w-20 h-20 bg-emerald-50 rounded-full flex items-center justify-center text-emerald-600 mb-4 shadow-inner">
                      <Icon name="camera" className="w-10 h-10" />
                    </div>
                    <p className="text-xs text-slate-400 mt-2 max-w-[200px] leading-relaxed">{d.camInstructions}</p>
                  </div>
                )}

                {isLoading && (
                  <div className="absolute inset-0 bg-slate-900/70 backdrop-blur-sm flex flex-col items-center justify-center text-white z-10">
                    <div className="w-12 h-12 border-4 border-emerald-400 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-xs font-bold tracking-wide">{d.evaluating}</p>
                  </div>
                )}
                <canvas ref={canvasRef} className="hidden"></canvas>
              </div>

              <div className="mt-6 grid grid-cols-2 gap-3 shrink-0">
                {isCamOpen ? (
                  <button onClick={captureAndDiagnose} disabled={isLoading} className="col-span-2 flex justify-center items-center gap-2 py-4 bg-emerald-600 text-white font-bold rounded-[1.75rem] shadow-lg shadow-emerald-600/20 active:scale-95 transition-all">
                    <Icon name="scan-line" className="w-5 h-5" /> {d.capture}
                  </button>
                ) : (
                  <>
                    <button onClick={startCamera} disabled={isLoading} className="flex justify-center items-center gap-2 py-4 bg-emerald-600 text-white font-bold rounded-[1.75rem] shadow-lg shadow-emerald-600/20 active:scale-95 transition-all">
                      <Icon name="camera" className="w-5 h-5" /> {d.startCam}
                    </button>
                    <button onClick={() => fileRef.current?.click()} disabled={isLoading} className="flex justify-center items-center gap-2 py-4 bg-white text-slate-700 font-bold rounded-[1.75rem] shadow-sm border border-slate-100 active:scale-95 transition-all">
                      <Icon name="upload" className="w-5 h-5 text-slate-400" /> {d.upload}
                    </button>
                  </>
                )}
                <input ref={fileRef} type="file" accept="image/*" onChange={handleFileUpload} className="hidden" />
              </div>
            </div>
          </div>

          {/* Bottom Sheet Drawer */}
          <div className={`fixed inset-x-0 bottom-0 max-w-md mx-auto bg-white rounded-t-[2.5rem] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] z-40 flex flex-col ${diag ? 'drawer-open' : 'drawer-closed'}`} style={{maxHeight: '85vh'}}>
            {diag && (
              <div className="p-6 overflow-y-auto no-scrollbar pb-10">
                <div className="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-6 shrink-0"></div>
                
                <div className="flex justify-between items-start">
                  <div>
                    <span className="px-3 py-1 bg-rose-50 text-rose-600 text-[10px] font-black uppercase tracking-wider rounded-full border border-rose-100">
                      {diag.severity} {d.priority}
                    </span>
                    <h2 className="text-2xl font-black text-slate-900 mt-3 leading-tight">{diag.diseaseName}</h2>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3 mt-6">
                  <div className="bg-slate-50 border border-slate-100 p-4 rounded-3xl">
                    <p className="text-[10px] text-slate-400 font-bold tracking-widest">{d.confidence}</p>
                    <p className="text-2xl font-black text-slate-800 mt-1">{diag.confidence}%</p>
                  </div>
                  <div className="bg-slate-50 border border-slate-100 p-4 rounded-3xl">
                    <p className="text-[10px] text-slate-400 font-bold tracking-widest">{d.sharpness}</p>
                    <p className="text-2xl font-black text-emerald-600 mt-1">{diag.sharpness}</p>
                  </div>
                </div>

                <div className="mt-6">
                  <div className="flex bg-slate-100 p-1 rounded-2xl">
                    {['organic', 'chemical', 'prevention'].map(t => (
                      <button key={t} onClick={() => setActiveTab(t)} className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${activeTab === t ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}`}>
                        {d.tabs[t]}
                      </button>
                    ))}
                  </div>
                  <div className="mt-4 p-4 bg-slate-50 rounded-3xl border border-slate-100 min-h-[100px]">
                    <p className="text-sm text-slate-700 font-medium leading-relaxed">{diag.treatment[activeTab]}</p>
                  </div>
                </div>
                
                <button onClick={() => setDiag(null)} className="w-full mt-6 py-4 bg-slate-900 text-white rounded-[1.5rem] font-bold text-sm shadow-xl active:scale-95 transition-transform">{d.close}</button>
              </div>
            )}
          </div>
          {diag && <div className="fixed inset-0 bg-slate-900/20 backdrop-blur-sm z-30 transition-opacity" onClick={() => setDiag(null)}></div>}
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
